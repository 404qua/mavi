<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Earth Demo 1</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main>
		<div class="viewport__container">
			<div id="viewport"></div>
		</div>
		<div class="panels">
			<div class="panels__right">
				<div class="description panel">
					<h2>A Demo of MARS</h2>
					<hr>
					<p>
						This is a demo of a digital render of planet Mars. This demo has been made using surface and
						weather data from NASA and the rendering engine from CesiumJS.
					</p>
				</div>
				<hr>
				<div class="inputs panel">
					<h2>Inputs</h2>
					<hr>
					<div class="input__list">
						<div class="input">
							<span>Test Slider Input 1</span>
							<label class="slider">
								<input type="range">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Test Slider Input 2</span>
							<label class="slider">
								<input type="range">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Test Slider Input 3</span>
							<label class="slider">
								<input type="range" step="any">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Another Test Slider Input 3</span>
							<label class="slider">
								<input type="range" step="any">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>

<script type="module" src="script.js"></script>

</html>
