<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mavi</title>
	<link rel="stylesheet" href="style.css">

	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,1,0&icon_names=
		add,arrow_drop_down,close,close_small,landscape,layers,navigation,photo_camera,public,remove,rocket_launch,location_on,school" />
</head>

<body>
	<main>
		<div class="panels">
			<div class="panels--bottom panel--group">
				<div class="panel--group">
					<div class="panel__toolbar panel__toolbar--start">
						<div class="panel__window-button-group">
							<label class="toggleIcon button">
								<div class="iconOn">
									<span class="material-symbols-outlined">
										navigation
									</span>
								</div> <input type="radio" class="hidden uncheckable" name="bottomPanels1">
							</label>

							<div class="panel__window navigation-window">
								<h2>Path Finder</h2>
								<hr>
								<hr class="hidden">
								<div class="selectionInputs">
									<div class="accessoryLine"></div>

									<span class="selectionInput">
										<p>Start Position</p>

										<span class="selectionButton">
											<label class="button ">
												<p id="start-position-text">Select</p>
												<input type="button" class="hidden" name="bottomPanels1" id="start-position-select">
											</label>

											<label class="button disabled">
												<span class="material-symbols-outlined">
													close_small
												</span>
												<input type="button" class="hidden" name="bottomPanels1" id="clear-start-position-select">
											</label>
										</span>
									</span>


									<span class="selectionInput">
										<p>End Position</p>

										<span class="selectionButton">
											<label class="button">
												<p id="end-position-text">Select</p>
												<input type="button" class="hidden" name="bottomPanels1" id="end-position-select">
											</label>

											<label class="button disabled">
												<span class="material-symbols-outlined">
													close_small
												</span>
												<input type="button" class="hidden" name="bottomPanels1" id="clear-end-position-select">
											</label>
										</span>
									</span>
								</div>

								<hr class="hidden">
								<hr>
								<label class="button find-path">
									<p>Find Path</p>
									<input type="button" class="hidden" name="bottomPanels1" id="find-path-button">
								</label>
							</div>
						</div>
						<div class="panel__window-button-group">
							<label class="toggleIcon button">
								<div class="iconOn">
									<span class="material-symbols-outlined">
										layers
									</span>
								</div> <input type="radio" class="hidden uncheckable" name="bottomPanels1">
							</label>

							<div class="panel__window mission-select-window layer-select-window">
								<h2>Layers</h2>
								<hr>
								<hr class="hidden">

								<div class="sites">
									<label class="button">
										<div class="site">
											<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
											<div class="description">
												<h3>Surface</h3>
												<p>Regular Surface Imagery of Mars.</p>
											</div>
										</div>
										<input type="radio" class="hidden " name="imageryLayers" value="surface" checked>
									</label>

									<div class="site-group">
										<label class="group-header">
											<h2>Ice</h2>
											<span class="material-symbols-outlined">
												arrow_drop_down
											</span>
											<input type="checkbox" class="hidden">
										</label>

										<label class="button">
											<div class="site">
												<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
												<div class="description">
													<h3>Ice Level 1</h3>
												</div>
											</div>
											<input type="radio" class="hidden" value="ice1" name="imageryLayers">
										</label>

										<label class="button">
											<div class="site">
												<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
												<div class="description">
													<h3>Ice Level 2</h3>
													<p>Information about Ice Formations.</p>
												</div>
											</div>
											<input type="radio" class="hidden" value="ice2" name="imageryLayers">
										</label>

										<label class="button">
											<input type="radio" class="hidden" value="ice3" name="imageryLayers">
											<div class="site">
												<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
												<div class="description">
													<h3>Ice Level 3</h3>
													<p>Information about Ice Formations.</p>
												</div>
											</div>
										</label>
									</div>

									<span class="site-date">
										<label class="button">
											<input type="radio" class="hidden" value="ice3" name="imageryLayers">
											<div class="site">
												<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
												<div class="description">
													<h3>Ice Level 2</h3>
													<p>Information about Ice Formations.</p>
												</div>
											</div>
										</label>

										<span class="monthInput" data-min-month="5" data-max-month="8" data-min-year="2015" id="idk"></span>
									</span>
								</div>
							</div>
						</div>

						<div class="panel__window-button-group">
							<label class="toggleIcon button">
								<div class="iconOn">
									<span class="material-symbols-outlined">
										rocket_launch
									</span>
								</div> <input type="radio" class="hidden uncheckable" name="bottomPanels1">
							</label>

							<div class="panel__window mission-select-window">
								<h2>Mission Sites</h2>
								<hr>
								<hr class="hidden">

								<div class="sites">
									<label class="button">
										<div class="site">
											<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
											<div class="description">
												<h3>Global View</h3>
												<p>View the entirety of Mars.</p>
											</div>
										</div>
										<input type="radio" class="hidden " name="missionSites" checked value="Global">
									</label>

									<label class="button">
										<div class="site">
											<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
											<div class="description">
												<h3>AP-1</h3>
												<p>Site</p>
											</div>
										</div>
										<input type="radio" class="hidden " name="missionSites" value="AP_1">
									</label>

									<label class="button">
										<div class="site">
											<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
											<div class="description">
												<h3>AP-8</h3>
												<p>Site</p>
											</div>
										</div>
										<input type="radio" class="hidden " name="missionSites" value="AP_8">
									</label>

									<label class="button">
										<div class="site">
											<img src="https://marswalk-imagery.pages.dev/features/2289.jpg">
											<div class="description">
												<h3>AP-9</h3>
												<p>Site</p>
											</div>
										</div>
										<input type="radio" class="hidden" name="missionSites" value="AP_9">
									</label>
								</div>
							</div>
						</div>
					</div>

					<div class="panel__toolbar">
						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									school
								</span>
							</div> <input type="checkbox" class="hidden school">
						</label>
					</div>
				</div>

				<div class="panel__sidebar panel__sidebar--right">
					<div class="button" id="zoom-in">
						<span class="material-symbols-outlined">
							add
						</span>
					</div>

					<div class="button" id="zoom-out">
						<span class="material-symbols-outlined">
							remove
						</span>
					</div>
				</div>

				<div class="panel__sidebar panel__sidebar--right">
					<label class="button" id="waypointsEnabledLabel">
						<span class="material-symbols-outlined">
							location_on
						</span>

						<input type="checkbox" id="waypointsEnabled" class="hidden" checked>
					</label>
				</div>

				<div class="panel__sidebar panel__sidebar--right">
					<div class="icon">
						<span class="material-symbols-outlined">
							photo_camera
						</span>
					</div>

					<div class="container">
						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									landscape
								</span>
							</div> <input type="radio" class="hidden" name="camera" value="firstPersonCamera">
						</label>

						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									public
								</span>
							</div> <input type="radio" name="camera" class="hidden" value="normal" checked>
						</label>
					</div>
				</div>
			</div>


			<div class="panel--group">
				<div class="planet-feature-info">
					<div id="planet-feature-info" class="content"> </div>
					<label class="toggleIcon button closeButton">
						<div class="iconOn">
							<span class="material-symbols-outlined">
								close
							</span>
						</div> <input type="checkbox" class="hidden" id="planet-feature-info__close" autocomplete="off">
					</label>
				</div>
			</div>
			<div class="panel--group">
				<div class="joystick disabled" id="joystick">
					<div class="joystick__thumb" id="joystick__thumb">
					</div>
				</div>
			</div>
		</div>

		<div class="viewport__container">
			<div id="viewport"></div>
		</div>
	</main>

	<div class="learn-window">
		<p>Under Construction...</p>
	</div>

	<script type="module" src="script.js"></script>
</body>

</html>
