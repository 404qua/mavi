<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mavi</title>
	<link rel="stylesheet" href="style.css">

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,1,0&icon_names=
		add,close,landscape,layers,navigation,photo_camera,public,remove,school" />
</head>

<body>
	<main>
		<div class="panels">
			<div class="panels--bottom panel--group">
				<div class="panel--group">

					<div class="panel__toolbar panel__toolbar--start">
						<div class="button">
							<span class="material-symbols-outlined">
								navigation
							</span>
						</div>
						<div class="button">
							<span class="material-symbols-outlined">
								layers
							</span>
						</div>
					</div>

					<div class="panel__toolbar">
						<div class="button">
							<span class="material-symbols-outlined">
								school
							</span>
						</div>
					</div>
				</div>
				<div class="panel__sidebar panel__sidebar--right">
					<div class="button">
						<span class="material-symbols-outlined">
							add
						</span>
					</div>

					<div class="button">
						<span class="material-symbols-outlined">
							remove
						</span>
					</div>
				</div>

				<div class="panel__sidebar panel__sidebar--right">

					<div class="icon">
						<span class="material-symbols-outlined">
							photo_camera
						</span>
					</div>

					<div class="container">
						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									landscape
								</span>
							</div> <input type="radio" class="hidden" name="camera" value="firstPersonCamera">
						</label>



						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									public
								</span>
							</div> <input type="radio" name="camera" class="hidden" value="normal" checked>
						</label>
					</div>
				</div>
			</div>
			<div class="panel--group">
				<div class="planet-feature-info">
					<div id="planet-feature-info" class="content"> </div>

					<label class="toggleIcon button">
						<div class="iconOn">
							<span class="material-symbols-outlined">
								close
							</span>
						</div> <input type="checkbox" class="hidden" id="planet-feature-info__close" autocomplete="off">
					</label>
				</div>
			</div>
		</div>

		<div class="viewport__container">
			<div id="viewport"></div>
		</div>
	</main>

	<script type="module" src="script.js"></script>
</body>

</html>
