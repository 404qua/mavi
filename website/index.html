						<input type="checkbox" id="waypointsEnabled" class="hidden" checked>
					</label>
				</div>

				<div class="panel__sidebar panel__sidebar--right camera-toggle">
					<div class="icon">
						<span class="material-symbols-outlined">
							photo_camera
						</span>
					</div>

					<div class="container">
						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									landscape
								</span>
							</div> <input type="radio" class="hidden" name="camera" value="firstPersonCamera">
						</label>

						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									public
								</span>
							</div> <input type="radio" name="camera" class="hidden" value="normal" checked>
						</label>
					</div>
				</div>
			</div>


			<div class="panel--group">
				<div class="planet-feature-info">
					<div id="planet-feature-info" class="content"> </div>
					<label class="toggleIcon button closeButton">
						<div class="iconOn">
							<span class="material-symbols-outlined">
								close
							</span>
						</div> <input type="checkbox" class="hidden" id="planet-feature-info__close" autocomplete="off">
					</label>
				</div>
			</div>
			<div class="panel--group">
				<div class="joystick disabled" id="joystick">
					<div class="joystick__thumb" id="joystick__thumb">
					</div>
				</div>
			</div>

			<div class="panel--group">
				<div class="search">
					<div class="search__box">
						<form onsubmit="return false">
							<input type="text" placeholder="Search" id="search_box" autocomplete="off">
							<label>
								<span class="material-symbols-outlined">
									close_small
								</span>
								<input type="reset" value="X" class="hidden" aria-label="Clear the search field">
							</label>
						</form>

						<label class="search__box_search-icon">
							<span class="material-symbols-outlined">
								search
							</span>
							<!-- <input type="button" value="Search" class="hidden"> -->
						</label>
					</div>

					<div class="search__result-box" id="search_results">
					</div>

				</div>
			</div>
		</div>

		<div class="viewport__container">
			<div id="viewport"></div>
			<div id="weather-legend-hud" class="weather-legend-hud" style="display: none;">
				<button id="weather-legend-close" class="weather-legend-close" title="Hide scale">&times;</button>
				<img id="weather-legend-hud-img" alt="Layer Scale" src="">
			</div>
		</div>
	</main>

	<div class="learn-window">
		<div class="mission-window" id="missions">

		</div>
	</div>

	<dialog class="mission-dialog" id="mission-dialog"></dialog>

	<script type="module" src="script.js"></script>
</body>

</html>
