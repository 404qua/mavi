<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mavi</title>
	<link rel="stylesheet" href="style.css">

	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,1,0&icon_names=
		add,close,close_small,landscape,layers,navigation,photo_camera,public,remove,school" />
</head>

<body>
	<main>
		<div class="panels">
			<div class="panels--bottom panel--group">
				<div class="panel--group">
					<div class="panel__toolbar panel__toolbar--start">
						<div class="panel__window-button-group">
							<label class="toggleIcon button">
								<div class="iconOn">
									<span class="material-symbols-outlined">
										navigation
									</span>
								</div> <input type="radio" class="hidden uncheckable" name="bottomPanels1">
							</label>

							<div class="panel__window navigation-window">
								<h2>Path Finder</h2>
								<hr>
								<hr class="hidden">
								<div class="selectionInputs">
									<div class="accessoryLine"></div>

									<span class="selectionInput">
										<p>Start Position</p>

										<span class="selectionButton">
											<label class="button ">
												<p id="start-position-text">Select</p>
												<input type="button" class="hidden" name="bottomPanels1"
													id="start-position-select">
											</label>

											<label class="button disabled">
												<span class="material-symbols-outlined">
													close_small
												</span>
												<input type="button" class="hidden" name="bottomPanels1"
													id="clear-start-position-select">
											</label>
										</span>
									</span>


									<span class="selectionInput">
										<p>End Position</p>

										<span class="selectionButton">
											<label class="button">
												<p id="end-position-text">Select</p>
												<input type="button" class="hidden" name="bottomPanels1"
													id="end-position-select">
											</label>

											<label class="button disabled">
												<span class="material-symbols-outlined">
													close_small
												</span>
												<input type="button" class="hidden" name="bottomPanels1"
													id="clear-end-position-select">
											</label>
										</span>
									</span>
								</div>

								<hr class="hidden">
											<hr>
								<label class="button find-path">
									<p>Find Path</p>
									<input type="button" class="hidden" name="bottomPanels1" id="find-path-button">
								</label>
							</div>
						</div>
						<div class="panel__window-button-group">
							<label class="toggleIcon button">
								<div class="iconOn">
									<span class="material-symbols-outlined">
										layers
									</span>
								</div> <input type="radio" class="hidden uncheckable" name="bottomPanels1">
							</label>
						</div>
					</div>

					<div class="panel__toolbar">
						<div class="button">
							<span class="material-symbols-outlined">
								school
							</span>
						</div>
					</div>
				</div>
				<div class="panel__sidebar panel__sidebar--right">
					<div class="button">
						<span class="material-symbols-outlined">
							add
						</span>
					</div>

					<div class="button">
						<span class="material-symbols-outlined">
							remove
						</span>
					</div>
				</div>

				<div class="panel__sidebar panel__sidebar--right">

					<div class="icon">
						<span class="material-symbols-outlined">
							photo_camera
						</span>
					</div>

					<div class="container">
						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									landscape
								</span>
							</div> <input type="radio" class="hidden" name="camera" value="firstPersonCamera">
						</label>

						<label class="toggleIcon button">
							<div class="iconOn">
								<span class="material-symbols-outlined">
									public
								</span>
							</div> <input type="radio" name="camera" class="hidden" value="normal" checked>
						</label>
					</div>
				</div>
			</div>
			<div class="panel--group">
				<div class="planet-feature-info">
					<div id="planet-feature-info" class="content"> </div>
					<label class="toggleIcon button closeButton">
						<div class="iconOn">
							<span class="material-symbols-outlined">
								close
							</span>
						</div> <input type="checkbox" class="hidden" id="planet-feature-info__close" autocomplete="off">
					</label>
				</div>
			</div>
			<div class="panel--group"> 
				<div class="joystick disabled" id="joystick">
				<div class="joystick__thumb" id="joystick__thumb">
				</div>
				</div>
			</div>
		</div>

		<div class="viewport__container">
			<div id="viewport"></div>
		</div>
	</main>

	<script type="module" src="script.js"></script>
</body>

</html>
