<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Earth Demo 1</title>
	<link rel="stylesheet" href="style.css">
    <link rel="preload" as="image" href="../../Data/2k/baseMap.jpg">
    <link rel="preload" as="image" href="../../Data/2k/marsHeight.png">

	<script src="https://unpkg.com/@upng/upng-js@2.2.2/dist/UPNG.umd.js"></script>
	<script type="importmap">{
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
	<script type="module" src="./scripts/lib/assetLoader/loader.js"></script>
</head>

<body>
	<main>
		<div class="viewport__container">
			<div id="viewport"></div>
		</div>
		<div class="panels">
			<div class="panels__right">
				<div class="description panel">
					<h2>A Demo of Planet Earth</h2>
					<hr>
					<p>
						This is a demo of a digital render of planet earth. This demo has been made using surface and
						weather data from nasa.
					</p>
				</div>
				<hr>
				<div class="inputs panel">
					<h2>Inputs</h2>
					<hr>
					<div class="input__list">
						<div class="input">
							<span>Test Slider Input 1</span>
							<label class="slider">
								<input type="range">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Test Slider Input 2</span>
							<label class="slider">
								<input type="range">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Test Slider Input 3</span>
							<label class="slider">
								<input type="range" step="any">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>

						<div class="input">
							<span>Another Test Slider Input 3</span>
							<label class="slider">
								<input type="range" step="any">
								<span class="fill"></span>
								<span class="thumb"></span>
								<span class="track"></span>
							</label>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>

<script type="module" src="script.js"></script>

</html>
